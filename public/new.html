<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="./assets/icons8-favicon-16.png">
    <title>Love Light</title>

    <!-- CSP to allow Google Identity Services -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self';
             script-src 'self' https://accounts.google.com https://apis.google.com https://*.gstatic.com 'unsafe-inline';
             connect-src 'self' https://accounts.google.com https://*.google.com https://play.google.com;
             frame-src 'self' https://accounts.google.com;
             img-src 'self' https://accounts.google.com data:;
             style-src 'self' https://fonts.googleapis.com 'unsafe-inline';
             font-src 'self' https://fonts.gstatic.com;">

    <link rel="stylesheet" href="./style/new.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer nonce="GoogleSignInNonce"></script>
    <script>
        // Safe JSON parsing
        function safeJsonParse(res) { return res.text().then(t => { try { return t.trim() ? JSON.parse(t) : {} } catch (e) { console.error(e, t); return {} } }); }

        // Sign-up handler
        async function handleCredentialResponseSignUp(response) {
            function setCookie(n, v, d) { let e = ''; if (d) { let dt = new Date(); dt.setTime(dt.getTime() + d * 864e5); e = ';expires=' + dt.toUTCString(); } document.cookie = `${n}=${v || ''}${e};path=/`; }
            function getCookie(n) { let ca = document.cookie.split(';'), p = `${n}=`; for (let c of ca) { c = c.trim(); if (c.indexOf(p) == 0) return c.slice(p.length); } return null; }
            try {
                console.log("JWT:", response.credential);
                const { url } = await fetch('/url').then(res => res.json());
                const signupRes = await fetch(`${url}/auth/signup`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ token: response.credential })
                });
                const data = await signupRes.json();
                setCookie("email", data.user.email, 7);
                setCookie("nickname", data.user.given_name, 7);

                // send to your backend
                await fetch('/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        nickname: data.user.given_name,
                        email: data.user.email
                    })
                });

                // onboarding email
                await fetch('/resend/sendOnboarding', {
                    method: 'POST',
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        email: getCookie("email"),
                        nickname: getCookie("nickname")
                    })
                });

                // redirect or further logic here
            } catch (err) {
                console.error(err);
            }
        }

        // Sign-in handler
        function handleCredentialResponseSignIn(response) {
            function setCookie(n, v, d) { let e = ''; if (d) { let dt = new Date(); dt.setTime(dt.getTime() + d * 864e5); e = ';expires=' + dt.toUTCString(); } document.cookie = `${n}=${v || ''}${e};path=/`; }
            console.log("JWT:", response.credential);
            fetch('/auth/login', {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                credentials: 'include',
                body: JSON.stringify({ token: response.credential })
            })
                .then(res => {
                    if (!res.ok) throw new Error(res.status);
                    return safeJsonParse(res);
                })
                .then(data => {
                    if (!data.user?.email) throw new Error("Invalid login response");
                    setCookie("email", data.user.email, 7);
                    return fetch(`/person/getNicknameByEmail/${data.user.email}`);
                })
                .then(res => {
                    if (res.ok) return safeJsonParse(res);
                    if (res.status === 404) return null;
                    throw new Error("Nickname fetch failed");
                })
                .then(nick => {
                    if (nick) setCookie("nickname", nick, 7);
                    window.location.href = '/home';
                })
                .catch(err => {
                    console.error(err);
                    alert("Sign-in failed. Please try again.");
                });
        }

        window.onload = function () {
            
            // Signup button
            google.accounts.id.initialize({
                client_id: '1008255651433-9avppqr195tjhv6ig2b2bcbt5l3m8luv.apps.googleusercontent.com',
                callback: handleCredentialResponseSignUp
            });
            google.accounts.id.renderButton(
                document.querySelector('.google-signup'),
                {
                    theme: 'filled_blue',
                    size: 'large',
                    text: 'signup_with',
                    shape: 'pill',
                    width: 260
                }
            );

            google.accounts.id.renderButton(
                document.querySelector('.google-signin'),
                {
                    type: 'standard',
                    theme: 'outline',
                    size: 'large',
                    text: 'signin_with',
                    shape: 'pill',
                    width: 260
                }
            );
        };

    </script>
</head>

<body>
    <div class="container">
        <div id="big-text-div">
            <p class="love">Love</p>
            <p class="light">Light</p>
            <div class="sign-buttons">
                <div class="google-signup"></div>
                <div class="google-signin"></div>
            </div>
        </div>

        <div id="traffic-light" class="traffic-light">
            <button class="light-button">
                <div id="red" class="red-light"></div>
            </button>
            <button class="light-button">
                <div id="yellow" class="yellow-light"></div>
            </button>
            <button class="light-button">
                <div id="green" class="green-light"></div>
            </button>
        </div>
    </div>
</body>

</html>
